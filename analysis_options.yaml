# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

dcm:
  metrics:
    cyclomatic-complexity: 10       # Complejidad lógica máxima por método.
    halstead-volume: 150            # Límite de complejidad computacional.
    lines-of-code: 100              # Límite de líneas por archivo para mantener SRP.
    maximum-nesting-level: 3        # Límite de niveles de anidación permitidos.
    number-of-parameters: 4         # Máximo de parámetros por función o constructor.
    source-lines-of-code: 50        # Límite de líneas de código fuente por método.

  metrics-exclude:
    - test/**
    - lib/**/*.g.dart               # Excluye archivos autogenerados (ej. json_serializable).
    - lib/**/*.freezed.dart         # Excluye archivos generados por freezed.

  rules:
    - avoid-dynamic                     # Restringe el uso de tipos dinámicos.
    - avoid-non-null-assertion          # Prohíbe el uso del operador '!'.
    - avoid-unnecessary-type-casts      # Evita casteos redundantes con 'as'.
    - avoid-unnecessary-type-assertions # Evita el uso redundante del operador 'is'.

    - avoid-global-state                # Prohíbe el estado global mutable.
    - prefer-single-widget-per-file     # Limita a un widget principal por archivo.
    - prefer-extracting-callbacks       # Obliga a extraer lógica de callbacks a métodos.
    - avoid-late-keyword                # Restringe inicializaciones tardías.

    - avoid-redundant-async             # Evita declaraciones 'async' sin 'await'.
    - avoid-passing-async-when-sync-expected
    - prefer-async-await                # Fomenta 'async/await' sobre el uso crudo de Futures.

    - no-boolean-literal-compare        # Evita comparaciones redundantes (ej. valor == true).
    - no-empty-block                    # Prohíbe bloques de control de flujo vacíos.
    - prefer-conditional-expressions    # Prioriza operadores ternarios sobre if/else simples.